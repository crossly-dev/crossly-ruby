# Build, test and package on every push (any branch) and pull request.
#
# Managed by tools/sdk-repo/seed.mjs in the Crossly monorepo: edits here are overwritten on the next seed.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: build seller
        run: bash codegen/ci/check.sh ruby seller
      - name: build buyer
        run: bash codegen/ci/check.sh ruby buyer
      - name: webhook conformance vectors
        working-directory: codegen/integrations/webhooks/ruby
        run: ruby check_vectors.rb
      - name: package
        run: |
          mkdir -p dist
          for d in seller buyer; do
            spec=$(cd "$d" && ls *.gemspec | head -1)
            sed -i -E \
              -e 's|^( *s\.license *= *).*|\1"MIT"|' \
              -e 's|^( *s\.authors *= *).*|\1["Crossly"]|' \
              -e 's|^( *s\.homepage *= *).*|\1"https://github.com/crossly-dev/crossly-ruby"|' \
              "$d/$spec"
            (cd "$d" && gem build "$spec" && mv ./*.gem ../dist/)
          done
          ls -l dist
          # Once assembled (assemble.mjs vendors them), every gem must ship the verifier and the client.
          if [ -f seller/lib/crossly_kit.rb ]; then
            for g in dist/*.gem; do
              for f in lib/crossly_webhooks.rb lib/crossly_kit.rb; do
                gem spec "$g" files | grep -q "$f" || { echo "::error::$g does not ship $f"; exit 1; }
              done
            done
          fi
